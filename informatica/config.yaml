# NiFi Configuration for DAILY_SALES_LOAD Workflow Migration
# Customer Dimension Upsert Logic with SCD Type 2

nifi:
  base_url: "http://localhost:8080/nifi-api"
  process_group_name: "DAILY_SALES_LOAD"
  
database:
  staging:
    connection_name: "staging_db_pool"
    url: "jdbc:postgresql://localhost:5432/staging_db"
    driver: "org.postgresql.Driver"
    username: "etl_user"
    password: "${DB_PASSWORD}"
    max_connections: 10
    
  target:
    connection_name: "target_dw_pool"
    url: "jdbc:postgresql://localhost:5432/datawarehouse"
    driver: "org.postgresql.Driver"
    username: "dw_user"
    password: "${DW_PASSWORD}"
    max_connections: 10

sources:
  staging_customer_table: "STG_CUSTOMER"
  
targets:
  customer_dimension_table: "DIM_CUSTOMER"
  
sequences:
  customer_key_sequence: "SEQ_CUSTOMER_KEY"
  
queries:
  extract_staging_customer: |
    SELECT
        CUSTOMER_ID,
        FIRST_NAME,
        LAST_NAME,
        EMAIL,
        PHONE,
        ADDRESS,
        CITY,
        STATE,
        ZIP_CODE,
        COUNTRY,
        REGISTRATION_DATE,
        CUSTOMER_TYPE,
        SOURCE_SYSTEM,
        LOAD_DATE
    FROM STG_CUSTOMER
    WHERE LOAD_DATE >= ?
    
  lookup_existing_customer: |
    SELECT
        CUSTOMER_KEY,
        CUSTOMER_ID,
        FIRST_NAME,
        LAST_NAME,
        EMAIL,
        PHONE,
        ADDRESS,
        EFFECTIVE_FROM_DATE
    FROM DIM_CUSTOMER
    WHERE CUSTOMER_ID = ?
    AND IS_CURRENT = 'Y'
    
  expire_old_record: |
    UPDATE DIM_CUSTOMER
    SET EFFECTIVE_TO_DATE = CURRENT_TIMESTAMP - INTERVAL '1 day',
        IS_CURRENT = 'N',
        UPDATED_DATE = CURRENT_TIMESTAMP
    WHERE CUSTOMER_KEY = ?
    
  insert_new_record: |
    INSERT INTO DIM_CUSTOMER (
        CUSTOMER_KEY,
        CUSTOMER_ID,
        FIRST_NAME,
        LAST_NAME,
        FULL_NAME,
        EMAIL,
        PHONE,
        ADDRESS,
        CITY,
        STATE,
        ZIP_CODE,
        COUNTRY,
        REGISTRATION_DATE,
        CUSTOMER_TYPE,
        EFFECTIVE_FROM_DATE,
        EFFECTIVE_TO_DATE,
        IS_CURRENT,
        CREATED_DATE,
        SOURCE_SYSTEM
    ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
    
  get_next_customer_key: |
    SELECT nextval('SEQ_CUSTOMER_KEY')

processing:
  batch_size: 1000
  error_threshold: 100
  commit_interval: 10000
  
error_handling:
  error_table: "ETL_ERROR_LOG"
  max_retries: 3
  retry_delay_seconds: 60
  
logging:
  level: "INFO"
  error_email: "etl-team@company.com"
  
scheduling:
  last_extract_date_attribute: "last_extract_date"
  default_lookback_days: 1