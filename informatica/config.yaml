# NiFi Migration Configuration for wf_DIMENSION_LOAD
# Full Staging Refresh with Multi-Key Upserts

nifi:
  base_url: "http://localhost:8080/nifi-api"
  username: "admin"
  password: "admin_password"
  root_pg_id: "root"
  
workflow:
  name: "wf_DIMENSION_LOAD"
  description: "Weekly Dimension Refresh - Full Staging Truncate/Reload with Multi-Key Upserts"
  schedule: "0 0 1 ? * SUN"  # Every Sunday at 1:00 AM
  
database:
  staging:
    connection_url: "jdbc:postgresql://localhost:5432/staging_db"
    driver: "org.postgresql.Driver"
    username: "staging_user"
    password: "${DB_STAGING_PASSWORD}"
    max_pool_size: 10
    
  warehouse:
    connection_url: "jdbc:postgresql://localhost:5432/warehouse_db"
    driver: "org.postgresql.Driver"
    username: "warehouse_user"
    password: "${DB_WAREHOUSE_PASSWORD}"
    max_pool_size: 20

source:
  file_path: "/data/source_files/"
  customer_file: "customer_master.csv"
  product_file: "product_master.csv"
  file_format: "csv"
  delimiter: ","
  has_header: true
  encoding: "UTF-8"

staging:
  customer_table: "STG_CUSTOMER"
  product_table: "STG_PRODUCT"
  truncate_before_load: true
  batch_size: 10000
  
dimensions:
  customer:
    table: "DIM_CUSTOMER"
    surrogate_key: "CUSTOMER_KEY"
    natural_key: "CUSTOMER_ID"
    scd_type: 2
    effective_from_column: "EFFECTIVE_FROM_DATE"
    effective_to_column: "EFFECTIVE_TO_DATE"
    is_current_column: "IS_CURRENT"
    update_strategy: "insert_update"
    
  product:
    table: "DIM_PRODUCT"
    surrogate_key: "PRODUCT_KEY"
    natural_key: "PRODUCT_ID"
    scd_type: 1
    update_strategy: "upsert"

sequences:
  customer_key:
    name: "SEQ_CUSTOMER_KEY"
    start_value: 1
    cache_size: 1000
    
  product_key:
    name: "SEQ_PRODUCT_KEY"
    start_value: 1
    cache_size: 1000

processing:
  high_precision_numeric: true
  numeric_scale: 10
  numeric_precision: 2
  parallel_threads: 4
  error_tolerance: 0.01  # 1% error threshold
  
error_handling:
  max_retries: 3
  retry_delay_seconds: 60
  failure_email: "etl-team@company.com"
  dba_email: "dba-team@company.com"
  error_log_table: "ETL_ERROR_LOG"

monitoring:
  log_level: "INFO"
  metrics_enabled: true
  statistics_update: true
  index_rebuild: true
  
archival:
  archive_path: "/data/archive/"
  backup_before_load: true
  retention_days: 90

notifications:
  success_email: "etl-team@company.com"
  failure_email: "etl-team@company.com,dba-team@company.com"
  smtp_host: "smtp.company.com"
  smtp_port: 587
  from_address: "nifi-etl@company.com"