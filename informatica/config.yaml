# NiFi Full Refresh Workflow Configuration
# Migration from Informatica wf_FULL_REFRESH
# Truncate-all pattern with bulk load using 100K commit intervals

workflow:
  name: "wf_FULL_REFRESH"
  description: "Monthly full refresh with truncate-all pattern and bulk load optimization"
  schedule: "0 0 1 * *"  # First day of month at midnight

nifi:
  base_url: "http://localhost:8080/nifi-api"
  root_process_group: "root"
  process_group_name: "FULL_REFRESH_WORKFLOW"

database:
  staging:
    connection_pool: "staging-db-pool"
    schema: "STG"
    tables:
      - "STG_CUSTOMER"
      - "STG_PRODUCT"
      - "STG_SALES"
  
  warehouse:
    connection_pool: "warehouse-db-pool"
    schema: "DWH"
    dimension_tables:
      - "DIM_CUSTOMER"
      - "DIM_PRODUCT"
    fact_tables:
      - "FACT_SALES"

sources:
  file_path: "/data/source/"
  archive_path: "/data/archive/"
  patterns:
    customer: "customer_master.csv"
    product: "product_master.csv"
    sales: "sales_transactions_*.csv"
  
  file_format:
    type: "CSV"
    delimiter: ","
    header: true
    charset: "UTF-8"

performance:
  bulk_load:
    enabled: true
    commit_interval: 100000
    batch_size: 10000
  
  partitioning:
    enabled: true
    partition_count: 4
    partition_type: "HASH"
  
  connection_pools:
    max_connections: 10
    min_connections: 2

error_handling:
  max_retries: 3
  retry_delay_seconds: 60
  failure_strategy: "ROLLBACK"
  
notifications:
  email:
    enabled: true
    smtp_host: "smtp.company.com"
    smtp_port: 587
    from: "nifi-etl@company.com"
    recipients:
      etl_team: "etl-team@company.com"
      dba_team: "dba-team@company.com"
      manager: "manager@company.com"

logging:
  level: "INFO"
  log_attributes: true
  provenance_retention_days: 30

validation:
  pre_refresh_checks: true
  post_load_validation: true
  data_quality_rules:
    - "NOT NULL checks"
    - "Referential integrity"
    - "Row count validation"

backup:
  enabled: true
  backup_path: "/data/backup/"
  retention_days: 90