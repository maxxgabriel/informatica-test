# NiFi Migration Configuration for m_LOAD_STG_SALES
# Extract, Filter and Transform sales staging data with quality filters

nifi:
  base_url: "http://localhost:8080/nifi-api"
  process_group_name: "LOAD_STG_SALES"
  
source:
  type: "csv"
  file_path: "/data/source/sales_transactions_*.csv"
  file_pattern: "sales_transactions_.*\\.csv"
  delimiter: ","
  has_header: true
  encoding: "UTF-8"
  
  # Source fields schema
  fields:
    - name: "TRANSACTION_ID"
      type: "string"
      length: 30
    - name: "TRANSACTION_DATE"
      type: "datetime"
      format: "%Y-%m-%d %H:%M:%S"
    - name: "CUSTOMER_ID"
      type: "string"
      length: 20
    - name: "PRODUCT_ID"
      type: "string"
      length: 20
    - name: "QUANTITY"
      type: "integer"
    - name: "UNIT_PRICE"
      type: "decimal"
      precision: 10
      scale: 2
    - name: "DISCOUNT_PERCENT"
      type: "decimal"
      precision: 5
      scale: 2
    - name: "TAX_AMOUNT"
      type: "decimal"
      precision: 10
      scale: 2
    - name: "TOTAL_AMOUNT"
      type: "decimal"
      precision: 10
      scale: 2
    - name: "PAYMENT_METHOD"
      type: "string"
      length: 20
    - name: "STORE_ID"
      type: "string"
      length: 20
    - name: "REGION"
      type: "string"
      length: 50

# Quality filters (from Source Qualifier filter condition)
quality_filters:
  quantity_threshold: 0  # QUANTITY > 0
  total_amount_threshold: 0  # TOTAL_AMOUNT > 0

# Transformation metadata
metadata:
  load_date_field: "LOAD_DATE"
  source_system: "CSV_FILE"
  record_id_field: "RECORD_ID"
  record_id_start: 1
  record_id_increment: 1

target:
  type: "database"
  connection_pool: "STG_DATABASE_CONNECTION_POOL"
  table_name: "STG_SALES"
  schema: "staging"
  load_type: "normal"
  commit_interval: 10000
  
  # Target fields
  fields:
    - "RECORD_ID"
    - "TRANSACTION_ID"
    - "TRANSACTION_DATE"
    - "CUSTOMER_ID"
    - "PRODUCT_ID"
    - "QUANTITY"
    - "UNIT_PRICE"
    - "DISCOUNT_PERCENT"
    - "TAX_AMOUNT"
    - "TOTAL_AMOUNT"
    - "PAYMENT_METHOD"
    - "STORE_ID"
    - "REGION"
    - "LOAD_DATE"
    - "SOURCE_SYSTEM"

error_handling:
  error_table: "STG_SALES_ERRORS"
  error_log_path: "/data/logs/sales_staging_errors.log"
  max_retry_attempts: 3
  retry_delay_seconds: 5

monitoring:
  log_level: "INFO"
  success_notification_email: "etl-team@company.com"
  failure_notification_email: "etl-team@company.com"
  
performance:
  batch_size: 1000
  concurrent_tasks: 4
  buffer_size: 10000
  
validation:
  enforce_schema: true
  allow_null_customer_id: false
  allow_null_product_id: false
  allow_negative_quantity: false
  allow_negative_amount: false