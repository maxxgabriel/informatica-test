# Full Refresh Workflow Configuration
# Monthly truncate and reload for dimension and fact tables

nifi:
  base_url: "http://localhost:8080/nifi-api"
  process_group_name: "wf_FULL_REFRESH"
  
database:
  staging:
    host: "${DB_STAGING_HOST}"
    port: 5432
    database: "${DB_STAGING_NAME}"
    username: "${DB_STAGING_USER}"
    password: "${DB_STAGING_PASS}"
    
  warehouse:
    host: "${DB_WAREHOUSE_HOST}"
    port: 5432
    database: "${DB_WAREHOUSE_NAME}"
    username: "${DB_WAREHOUSE_USER}"
    password: "${DB_WAREHOUSE_PASS}"

source_files:
  base_path: "${SOURCE_FILE_PATH:/data/sources}"
  archive_path: "${ARCHIVE_PATH:/data/archive}"
  customer: "customer_master.csv"
  product: "product_master.csv"
  sales: "sales_transactions_*.csv"

staging_tables:
  customer: "STG_CUSTOMER"
  product: "STG_PRODUCT"
  sales: "STG_SALES"

dimension_tables:
  customer: "DIM_CUSTOMER"
  product: "DIM_PRODUCT"

fact_tables:
  sales: "FACT_SALES"

notifications:
  error_email: "${ERROR_EMAIL_TO:etl-team@company.com}"
  dba_email: "${DBA_EMAIL:dba-team@company.com}"
  manager_email: "${MANAGER_EMAIL:manager@company.com}"

execution:
  bulk_load_batch_size: 100000
  commit_interval: 50000
  partition_count: 4
  enable_parallelism: true
  max_concurrent_tasks: 4

scripts:
  pre_refresh_validation: "/scripts/pre_refresh_validation.sh"
  full_backup: "/scripts/full_backup.sh"
  disable_constraints: "/scripts/disable_constraints.sh"
  enable_constraints: "/scripts/enable_constraints.sh"
  truncate_staging: "/scripts/truncate_staging.sh"
  truncate_dimensions: "/scripts/truncate_dimensions.sh"
  truncate_fact: "/scripts/truncate_fact.sh"
  rebuild_indexes: "/scripts/rebuild_indexes.sh"
  update_statistics: "/scripts/update_statistics.sh"
  data_validation: "/scripts/data_validation.sh"

sequence_generators:
  customer_key:
    start_value: 1
    increment: 1
    cache_size: 1000
  product_key:
    start_value: 1
    increment: 1
    cache_size: 1000
  sales_key:
    start_value: 1
    increment: 1
    cache_size: 1000

scd_config:
  customer:
    type: "TYPE2"
    effective_date_column: "EFFECTIVE_FROM_DATE"
    expiry_date_column: "EFFECTIVE_TO_DATE"
    current_flag_column: "IS_CURRENT"
    default_expiry_date: "9999-12-31"
  product:
    type: "TYPE1"
    
workflow:
  schedule: "0 0 1 * *"  # First day of month at midnight
  timeout_seconds: 14400  # 4 hours
  retry_attempts: 3
  retry_delay_seconds: 300