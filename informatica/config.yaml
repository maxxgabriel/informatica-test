# Shared Framework Configuration
# Environment: development, staging, production

environment: ${ENVIRONMENT:development}

# Application Settings
application:
  name: "etl-framework"
  version: "1.0.0"
  correlation_id_header: "X-Correlation-ID"

# Logging Configuration
logging:
  level: ${LOG_LEVEL:INFO}
  format: "json"  # json or text
  output: "stdout"  # stdout, file, or both
  file_path: "${LOG_DIR:/var/log/etl}/etl-framework.log"
  max_file_size_mb: 100
  backup_count: 10
  include_correlation_id: true
  log_sql_queries: false  # Set true for debugging
  
  # Log levels by module
  loggers:
    nipyapi: WARNING
    sqlalchemy.engine: WARNING
    urllib3: WARNING

# Database Connections
databases:
  # Oracle Configuration
  oracle:
    source:
      host: ${ORACLE_SOURCE_HOST:localhost}
      port: ${ORACLE_SOURCE_PORT:1521}
      service_name: ${ORACLE_SOURCE_SERVICE:ORCL}
      username: ${ORACLE_SOURCE_USER:source_user}
      password: ${ORACLE_SOURCE_PASSWORD:}
      
      # Connection Pool Settings
      pool:
        pool_size: 5
        max_overflow: 10
        pool_timeout: 30
        pool_recycle: 3600
        pool_pre_ping: true
        echo: false
    
    target:
      host: ${ORACLE_TARGET_HOST:localhost}
      port: ${ORACLE_TARGET_PORT:1521}
      service_name: ${ORACLE_TARGET_SERVICE:DWH}
      username: ${ORACLE_TARGET_USER:dwh_user}
      password: ${ORACLE_TARGET_PASSWORD:}
      
      pool:
        pool_size: 10
        max_overflow: 20
        pool_timeout: 30
        pool_recycle: 3600
        pool_pre_ping: true
        echo: false
  
  # SQL Server Configuration
  sqlserver:
    source:
      host: ${SQLSERVER_SOURCE_HOST:localhost}
      port: ${SQLSERVER_SOURCE_PORT:1433}
      database: ${SQLSERVER_SOURCE_DB:SourceDB}
      username: ${SQLSERVER_SOURCE_USER:source_user}
      password: ${SQLSERVER_SOURCE_PASSWORD:}
      driver: ${SQLSERVER_DRIVER:ODBC Driver 17 for SQL Server}
      
      pool:
        pool_size: 5
        max_overflow: 10
        pool_timeout: 30
        pool_recycle: 3600
        pool_pre_ping: true
        echo: false
    
    target:
      host: ${SQLSERVER_TARGET_HOST:localhost}
      port: ${SQLSERVER_TARGET_PORT:1433}
      database: ${SQLSERVER_TARGET_DB:DWH}
      username: ${SQLSERVER_TARGET_USER:dwh_user}
      password: ${SQLSERVER_TARGET_PASSWORD:}
      driver: ${SQLSERVER_DRIVER:ODBC Driver 17 for SQL Server}
      
      pool:
        pool_size: 10
        max_overflow: 20
        pool_timeout: 30
        pool_recycle: 3600
        pool_pre_ping: true
        echo: false

# NiFi Configuration
nifi:
  host: ${NIFI_HOST:localhost}
  port: ${NIFI_PORT:8080}
  username: ${NIFI_USERNAME:}
  password: ${NIFI_PASSWORD:}
  use_ssl: ${NIFI_USE_SSL:false}
  verify_ssl: ${NIFI_VERIFY_SSL:true}
  api_base_url: ${NIFI_API_BASE_URL:http://localhost:8080/nifi-api}
  
  # Connection retry settings
  retry:
    max_attempts: 3
    backoff_factor: 2
    initial_delay: 1

# Retry Configuration
retry:
  max_attempts: 3
  backoff_multiplier: 2
  initial_delay_seconds: 1
  max_delay_seconds: 60
  
  # Retryable exceptions
  retryable_exceptions:
    - "DatabaseError"
    - "OperationalError"
    - "TimeoutError"
    - "ConnectionError"

# Performance Settings
performance:
  batch_size: 10000
  fetch_size: 5000
  commit_interval: 10000
  query_timeout_seconds: 300
  connection_timeout_seconds: 30

# Security
security:
  encrypt_passwords: true
  password_encryption_key: ${ENCRYPTION_KEY:}
  mask_sensitive_logs: true
  
  # Sensitive field patterns to mask in logs
  sensitive_patterns:
    - "password"
    - "passwd"
    - "secret"
    - "token"
    - "api_key"
    - "credential"

# Monitoring and Alerting
monitoring:
  enable_metrics: true
  metrics_port: 9090
  health_check_interval_seconds: 60
  
  alerts:
    email:
      enabled: false
      smtp_host: ${SMTP_HOST:}
      smtp_port: ${SMTP_PORT:587}
      from_address: ${ALERT_FROM_EMAIL:}
      to_addresses: ${ALERT_TO_EMAILS:}
    
    slack:
      enabled: false
      webhook_url: ${SLACK_WEBHOOK_URL:}

# Error Handling
error_handling:
  max_errors_before_abort: 100
  error_threshold_percentage: 5
  continue_on_error: false
  dead_letter_queue:
    enabled: true
    path: "${ERROR_DIR:/var/etl/errors}"